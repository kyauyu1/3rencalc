      <input id="newPresetPrice" type="number" placeholder="金額" style="padding:9px;border:1px solid #cbd5e1;border-radius:9px">
    </div>
    <button onclick="addPreset()" style="width:100%;margin-top:8px;padding:9px;border:0;border-radius:9px;background:#2563eb;color:white;font-weight:900">＋ プリセットを追加</button>
    <div style="font-size:11px;color:#64748b;margin:10px 0 6px">登録済みプリセット（カテゴリ解除／完全削除ができます）</div>
    <div id="presetManageList" style="max-height:330px;overflow:auto;display:flex;flex-direction:column;gap:6px"></div>
  </div>
</div>
<div id="modal" class="modal"><div style="position:absolute;right:105px;top:13px;display:flex;gap:6px"><button onclick="saveHistory()" style="background:#2563eb;color:white;border:0;border-radius:9px;padding:8px 10px;font-size:11px;font-weight:900">🕘 名前を付けて保存</button></div><button class="close" onclick="modal.classList.remove('on')">✕ 閉じる</button><div id="present" class="present"></div></div>
<script>
let presets=JSON.parse(localStorage.getItem('presets_drag_v2')||'null')||[{id:'1',name:'標準設置工事費',price:''},{id:'2',name:'5年延長保証料',price:''},{id:'3',name:'リサイクル収集運搬料',price:''},{id:'4',name:'エアコン標準工事',price:'',cat:'air'},{id:'5',name:'室外機化粧カバー',price:'',cat:'air'},{id:'6',name:'HDMIケーブル',price:'',cat:'tv'}];
let _startPrefs=(()=>{try{return JSON.parse(localStorage.getItem('calc_appearance_v2')||'{}')}catch(e){return {}}})(),_startN=Math.max(1,Math.min(3,Number(_startPrefs.initialPlans||1)));
let ps=Array.from({length:_startN},(_,i)=>({code:'ABC'[i],title:'プラン'+'ABC'[i],items:[{name:'商品本体',price:''},{name:'',price:''},{name:'',price:''}]})),active={p:0,i:0},expr='',filter=null,drag=null,timer=null,moveMode=false,movePresetId=null;
const $=id=>document.getElementById(id),money=n=>'¥'+(Number(n)||0).toLocaleString(),esc=s=>String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function value(s){if(!s)return 0;if(!/^[0-9+\-*/(). ]+$/.test(s))return Number(s)||0;try{let n=Function('"use strict";return ('+s+')')();return Number.isFinite(n)?Math.trunc(n):0}catch{return 0}}
function renderPreset(){let a=filter?presets.filter(x=>x.cat===filter):presets;$('preset').innerHTML=a.map(x=>`<button class="chip ${movePresetId===x.id?'selected':''}" type="button" data-id="${x.id}">${x.name}<br><b>${money(x.price)}</b></button>`).join('');document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('on',x.dataset.c===filter));document.querySelectorAll('.chip').forEach(x=>x.onpointerdown=startDrag)}
function startDrag(e){
 let el=e.currentTarget,id=el.dataset.id,sx=e.clientX,sy=e.clientY,moved=false,longPressed=false;
 clearTimeout(timer);
 timer=setTimeout(()=>{longPressed=true;drag=id;el.classList.add('drag');try{el.setPointerCapture(e.pointerId)}catch(_){};if(navigator.vibrate)navigator.vibrate(20)},300);
 el.onpointermove=v=>{
   if(Math.hypot(v.clientX-sx,v.clientY-sy)>18){moved=true;if(!longPressed)clearTimeout(timer)}
   document.querySelectorAll('.cat').forEach(c=>c.classList.remove('over'));
   if(longPressed){let hit=document.elementFromPoint(v.clientX,v.clientY)?.closest('.cat');if(hit)hit.classList.add('over')}
 };
 el.onpointerup=v=>{
   clearTimeout(timer);
   let hit=document.elementFromPoint(v.clientX,v.clientY)?.closest('.cat');
   if(longPressed&&hit){
     let p=presets.find(x=>x.id===id);
     if(p){p.cat=hit.dataset.c;localStorage.setItem('presets_drag_v2',JSON.stringify(presets));msg(p.name+' を '+hit.textContent.trim()+' に保存しました')}
   }else if(!longPressed&&!moved){
     if(moveMode){movePresetId=id;renderPreset();let p=presets.find(x=>x.id===id);msg((p?.name||'プリセット')+' を選択しました。移動先カテゴリをタップ')}
     else apply(id);
   }
   drag=null;el.classList.remove('drag');document.querySelectorAll('.cat').forEach(c=>c.classList.remove('over'));renderPreset()
 };
 el.onpointercancel=()=>{clearTimeout(timer);drag=null;el.classList.remove('drag');document.querySelectorAll('.cat').forEach(c=>c.classList.remove('over'))}
}
function filterCat(c){filter=filter===c?null:c;renderPreset()}
function toggleMoveMode(){
 moveMode=!moveMode;movePresetId=null;
 $('moveHint').style.display=moveMode?'block':'none';
 $('moveModeBtn').style.background=moveMode?'#f59e0b':'#fff';
 $('moveModeBtn').style.color=moveMode?'#fff':'#0f172a';
 renderPreset();
}
function categoryTap(c){
 if(moveMode&&movePresetId){
   let p=presets.find(x=>x.id===movePresetId);
   if(p){p.cat=c;localStorage.setItem('presets_drag_v2',JSON.stringify(presets));msg(p.name+' を '+catName(c)+' に移動しました')}
   movePresetId=null;moveMode=false;$('moveHint').style.display='none';$('moveModeBtn').style.background='#fff';$('moveModeBtn').style.color='#0f172a';filter=c;renderPreset();return;
 }
 filterCat(c);
}

function getHistory(){try{return JSON.parse(localStorage.getItem('guide_history_v2')||'[]')}catch(e){return []}}
function setHistory(h){localStorage.setItem('guide_history_v2',JSON.stringify(h))}
function openHistory(){renderHistory();$('historyModal').classList.add('on')}
function closeHistory(){$('historyModal').classList.remove('on')}
function saveHistory(){
 let h=getHistory(),now=new Date();
 let fallback=now.toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
 let input=$('historyName'),name=input&&$('historyModal').classList.contains('on')?input.value.trim():'';
 if(!name){
   let asked=prompt('保存する案内名を入力してください\n例：田中様 エアコン',fallback);
   if(asked===null)return;
   name=asked.trim()||fallback;
 }
 let snapshot={id:'h_'+Date.now(),savedAt:now.toISOString(),label:name,dateLabel:fallback,plans:JSON.parse(JSON.stringify(ps))};
 h.unshift(snapshot);if(h.length>30)h=h.slice(0,30);setHistory(h);
 if(input)input.value='';
 renderHistory();msg('「'+name+'」で案内履歴を保存しました');
}
function renderHistory(){
 let h=getHistory(),e=$('historyList');
 if(!h.length){e.innerHTML='<div style="padding:28px;text-align:center;color:#94a3b8;font-size:12px">まだ保存した案内履歴はありません</div>';return}
 e.innerHTML=h.map((x,i)=>{
   let sums=(x.plans||[]).map(p=>money((p.items||[]).reduce((a,it)=>a+value(it.price),0))).join(' / ');
   let titles=(x.plans||[]).map(p=>esc(p.title||('プラン'+p.code))).join('・');
   return `<div style="border:1px solid #e2e8f0;background:#f8fafc;border-radius:11px;padding:9px;display:flex;align-items:center;gap:8px">
     <div style="flex:1;min-width:0"><b style="font-size:12px">${esc(x.label)}</b>${x.dateLabel?`<span style="font-size:9px;color:#94a3b8;margin-left:6px">${esc(x.dateLabel)}</span>`:''}<div style="font-size:10px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${titles}</div><div style="font-size:11px;color:#2563eb;font-weight:900;margin-top:2px">${sums}</div></div>
     <button onclick="loadHistory(${i})" style="border:0;background:#059669;color:white;border-radius:8px;padding:7px 9px;font-size:10px;font-weight:900">引き続き</button>
     <button onclick="deleteHistory(${i})" style="border:1px solid #fecdd3;background:#fff1f2;color:#e11d48;border-radius:8px;padding:7px;font-size:10px;font-weight:900">削除</button>
   </div>`
 }).join('');
}
function loadHistory(i){
 let h=getHistory(),x=h[i];if(!x||!x.plans?.length)return;
 ps=JSON.parse(JSON.stringify(x.plans));ps.forEach((p,n)=>p.code='ABC'[n]);
 active={p:0,i:0};expr=String(ps[0].items?.[0]?.price||'');closeHistory();render();msg('過去の案内内容を呼び戻しました');
}
function deleteHistory(i){if(!confirm('この案内履歴を削除しますか？'))return;let h=getHistory();h.splice(i,1);setHistory(h);renderHistory()}
function openPresetManager(){renderPresetManager();$('presetModal').classList.add('on')}
function closePresetManager(){$('presetModal').classList.remove('on');renderPreset()}
function catName(c){return ({air:'エアコン',tv:'テレビ',fridge:'冷蔵庫',washer:'洗濯機'})[c]||'未分類'}
function renderPresetManager(){
 let e=$('presetManageList');
 e.innerHTML=presets.map((p,i)=>`<div style="display:flex;align-items:center;gap:7px;padding:8px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px">
   <div style="flex:1;min-width:0"><b>${esc(p.name)}</b> <span style="color:#2563eb;font-weight:900">${money(p.price)}</span><div style="font-size:10px;color:#64748b">${catName(p.cat)}</div></div>
   ${p.cat?`<button onclick="unassignPreset(${i})" style="border:1px solid #cbd5e1;background:white;border-radius:8px;padding:6px;font-size:10px;font-weight:800">カテゴリ解除</button>`:''}
   <button onclick="deletePreset(${i})" style="border:1px solid #fecdd3;background:#fff1f2;color:#e11d48;border-radius:8px;padding:6px;font-size:10px;font-weight:900">削除</button>
 </div>`).join('');
}
function addPreset(){
 let n=$('newPresetName').value.trim(), v=parseInt($('newPresetPrice').value);
 if(!n||!Number.isFinite(v))return msg('項目名と金額を入力してください');
 presets.push({id:'custom_'+Date.now(),name:n,price:v});
 localStorage.setItem('presets_drag_v2',JSON.stringify(presets));
 $('newPresetName').value='';$('newPresetPrice').value='';renderPresetManager();renderPreset();msg('プリセットを追加しました');
}
function unassignPreset(i){presets[i].cat=null;localStorage.setItem('presets_drag_v2',JSON.stringify(presets));renderPresetManager();renderPreset()}
function deletePreset(i){if(!confirm('このプリセットを完全に削除しますか？'))return;presets.splice(i,1);localStorage.setItem('presets_drag_v2',JSON.stringify(presets));renderPresetManager();renderPreset()}
function apply(id){let x=presets.find(p=>p.id===id);if(!x)return;let p=active.p,i=active.i;if(!ps[p]||!ps[p].items[i])return;ps[p].items[i].name=x.name;ps[p].items[i].price=String(x.price);expr=String(x.price);render();msg(x.name+' '+money(x.price)+' → プラン'+ps[p].code+'に反映しました')}
function render(){let el=$('plans');el.style.gridTemplateColumns=`repeat(${ps.length},minmax(0,1fr))`;el.innerHTML=ps.map((p,pi)=>`<div class="plan ${p.code}"><div class="ph"><span class="badge">${p.code}</span><input class="title" value="${esc(p.title)}" oninput="ps[${pi}].title=this.value">${pi?`<button class="trash" onclick="removePlan(${pi})">🗑</button>`:''}</div><div class="total"><small>お支払総額（税込）</small><b>${money(total(pi))}</b></div><div class="rows">${p.items.map((x,ii)=>`<div class="row"><div class="rowhead"><input class="name" value="${esc(x.name)}" placeholder="品名・項目名" oninput="ps[${pi}].items[${ii}].name=this.value"><button class="x" onclick="removeRow(${pi},${ii})">×</button></div><div class="price ${active.p===pi&&active.i===ii?'active':''}" onclick="select(${pi},${ii})">${money(value(x.price))}</div></div>`).join('')}<button class="add" onclick="addRow(${pi})">＋ 行追加</button></div></div>`).join('');let it=ps[active.p].items[active.i];$('target').textContent=`【プラン${ps[active.p].code}】${it.name||'項目'+(active.i+1)}`;$('display').textContent=expr||'0'}
function total(p){return ps[p].items.reduce((a,x)=>a+value(x.price),0)}function select(p,i){active={p,i};expr=String(ps[p].items[i].price||'');render()}function key(k){let it=ps[active.p].items[active.i];if(k==='clear')expr='';else if(k==='back')expr=expr.slice(0,-1);else if(k==='=')expr=String(value(expr));else if(k==='-'&&!expr)expr='-';else if('+-*/'.includes(k)){if(expr&&!'+-*/'.includes(expr.slice(-1)))expr+=k}else expr+=k;it.price=expr;render()}
function addRow(p){ps[p].items.push({name:'',price:''});select(p,ps[p].items.length-1)}function removeRow(p,i){if(ps[p].items.length>1)ps[p].items.splice(i,1);else ps[p].items[0]={name:'',price:''};active={p,i:0};expr=String(ps[p].items[0].price||'');render()}function addPlan(){if(ps.length===3)return msg('プランは最大3つです');let c='ABC'[ps.length];ps.push({code:c,title:'プラン'+c,items:JSON.parse(JSON.stringify(ps[0].items))});render()}function removePlan(i){ps.splice(i,1);ps.forEach((p,n)=>p.code='ABC'[n]);active={p:0,i:0};expr=String(ps[0].items[0].price||'');render()}function resetAll(){
 let a=getAppearance();
 if(a.resetConfirm!==false&&!confirm('現在の計算内容をリセットしますか？\n保存していない内容は消えます。'))return;let n=Math.max(1,Math.min(3,Number(a.initialPlans||1)));
 ps=Array.from({length:n},(_,i)=>({code:'ABC'[i],title:'プラン'+'ABC'[i],items:[{name:'商品本体',price:''},{name:'',price:''},{name:'',price:''}]}));
 active={p:0,i:0};expr='';render()}function msg(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1600)}
function present(){let e=$('present');e.style.gridTemplateColumns=`repeat(${ps.length},1fr)`;e.innerHTML=ps.map((p,i)=>`<div class="pc"><h3>${p.code}　${esc(p.title)}</h3>${p.items.filter(x=>x.name||x.price).map(x=>`<div class="line"><span>${esc(x.name||'項目')}</span><b>${money(value(x.price))}</b></div>`).join('')}<div class="big">${money(total(i))}</div></div>`).join('');$('modal').classList.add('on')}
renderPreset();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});

function openSettings(){
 let a=getAppearance();
 $('bgColorPicker').value=a.color||'#f1f5f9';
 applyUiPrefs();$('settingsModal').classList.add('on');
}
function closeSettings(){$('settingsModal').classList.remove('on')}
function getAppearance(){try{return JSON.parse(localStorage.getItem('calc_appearance_v2')||'{}')}catch(e){return {}}}
function saveAppearance(a){
 try{localStorage.setItem('calc_appearance_v2',JSON.stringify(a));return true}
 catch(e){alert('背景画像を保存できませんでした。別の写真を選んでください。');return false}
}
function applyAppearance(){
 let a=getAppearance(),root=document.body,theme=a.theme||'light';
 root.classList.remove('theme-light','theme-dark','theme-soft');
 root.classList.add('theme-'+theme);
 root.style.backgroundColor=a.color||(theme==='dark'?'#0b1220':theme==='soft'?'#dfe6ed':'#f1f5f9');
}
function applyUiPrefs(){
 let a=getAppearance(),b=document.body;
 b.classList.remove('keys-small','keys-normal','keys-large','text-normal','text-large','text-xlarge');
 b.classList.add('keys-'+(a.keySize||'normal'));
 b.classList.add('text-'+(a.textSize||'normal'));
 let t=$('resetConfirmToggle');if(t)t.checked=a.resetConfirm!==false;
}
function setKeySize(v){let a=getAppearance();a.keySize=v;if(saveAppearance(a)){applyUiPrefs();msg('テンキーサイズを変更しました')}}
function setTextSize(v){let a=getAppearance();a.textSize=v;if(saveAppearance(a)){applyUiPrefs();msg('文字サイズを変更しました')}}
function setInitialPlans(n){let a=getAppearance();a.initialPlans=n;if(saveAppearance(a))msg('次回の新規開始は '+(n===1?'Aのみ':n===2?'A・B':'A・B・C')+' になります')}
function setResetConfirm(v){let a=getAppearance();a.resetConfirm=!!v;if(saveAppearance(a))msg(v?'リセット確認をONにしました':'リセット確認をOFFにしました')}
function setTheme(t){let a=getAppearance();a.theme=t;if(saveAppearance(a)){applyAppearance();msg(t==='dark'?'ダークモードに変更しました':t==='soft'?'ソフトモードに変更しました':'ライトモードに変更しました')}}
function setBgColor(c){let a=getAppearance();a.color=c;if(saveAppearance(a))applyAppearance()}

function removeBgImage(){let a=getAppearance();delete a.image;if(saveAppearance(a)){applyAppearance();$('bgImageInput').value='';msg('背景写真を削除しました')}}
function resetAppearance(){localStorage.removeItem('calc_appearance_v2');applyAppearance();$('bgColorPicker').value='#f1f5f9';$('bgImageInput').value='';msg('背景を初期状態に戻しました')}
applyAppearance();

function toggleToolMenu(){$('toolMenu').classList.toggle('on')}
function openEnergyTool(){$('toolMenu').classList.remove('on');$('energyModal').classList.add('on');calcEnergy()}
function calcEnergy(){
 let a=Number(($('oldPower').value||'').replace(/,/g,'')),b=Number(($('newPower').value||'').replace(/,/g,'')),y=Number($('powerYears').value||5);
 if(!$('oldPower').value||!$('newPower').value){$('energyResult').textContent='金額を入力すると差額を表示します';return}
 let d=a-b,total=d*y;
 $('energyResult').innerHTML=d>=0?`年間 <b>${money(d)}</b> お得　／　${y}年間で <b>${money(total)}</b> お得`:`年間 <b>${money(Math.abs(d))}</b> 増　／　${y}年間で <b>${money(Math.abs(total))}</b> 増`;
}
const newbieGuides={
 air:['畳数・部屋の広さ','設置階・室外機位置','コンセント・電圧','配管穴・配管経路','お掃除機能・省エネ希望'],
 tv:['希望サイズ・視聴距離','地デジ中心か動画中心か','録画の必要性','ゲーム利用','設置方法・既存機器'],
 fridge:['設置幅・搬入経路','容量・人数','扉の開き方','よく使う部屋','省エネ・機能の希望'],
 washer:['設置寸法・防水パン','縦型かドラム式','容量・人数','乾燥の必要性','蛇口・排水・搬入経路']
};
function openNewbieTool(){$('toolMenu').classList.remove('on');$('newbieModal').classList.add('on');showGuide('air')}
function showGuide(c){
 let names={air:'エアコン',tv:'テレビ',fridge:'冷蔵庫',washer:'洗濯機'},a=newbieGuides[c];
 $('guideBody').innerHTML=`<b>${names[c]}｜まず確認</b><br>`+a.map((x,i)=>`${i+1}. ${x}`).join('<br>');
}
</script></body></body></html>
