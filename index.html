<!doctype html><html lang="ja"><meta name="apple-mobile-web-app-title" content="3連比較電卓">
<meta name="apple-mobile-web-app-capable" content="yes"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0f172a"><title>接客用 3連比較電卓</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:Arial,'Noto Sans JP',sans-serif;-webkit-tap-highlight-color:transparent}.slot.active{border-color:#2563eb!important;background:#eff6ff!important;box-shadow:0 0 0 3px #2563eb55}.dark .slot.active{background:#1e293b!important}</style><link rel="manifest" href="./manifest.json">
</head><body class="bg-slate-100 text-slate-800 h-screen overflow-hidden"><header class="bg-white border-b shadow-sm px-3 py-2 flex items-center justify-between gap-2"><div class="flex items-center gap-2"><div class="bg-blue-600 text-white p-2 rounded-xl">🧮</div><b>接客用 3連比較電卓</b><span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-1 rounded-full">iPad最適化</span></div><div class="flex gap-1"><button id="customerBtn" class="bg-emerald-600 text-white">🖥 お客様提示</button><button id="resetBtn" class="bg-rose-50 text-rose-600">↻ リセット</button><button id="darkBtn">☾</button></div></header><main class="h-[calc(100vh-58px)] p-2.5 flex gap-3 overflow-hidden"><aside class="w-72 sm:w-80 bg-white rounded-2xl border shadow-md p-3 flex flex-col gap-2 shrink-0 overflow-y-auto"><div class="border-b pb-2"><div class="flex justify-between text-xs font-bold mb-2"><span>🔖 プリセット</span><button id="manageBtn" class="text-blue-600">⚙ 管理・追加</button></div><select id="presetSelect" class="w-full border rounded-xl p-2 text-xs"><option value="">✨ 定番アイテム・工事費を選択</option></select></div><div class="bg-slate-900 text-white rounded-xl px-3 py-2 flex justify-between"><span class="text-xs text-slate-400">計算バッファ</span><b id="buffer" class="text-amber-400">0</b></div><div id="keypad" class="grid grid-cols-4 gap-1.5 mt-auto"></div><p class="text-[10px] text-slate-400 text-center border-t pt-2">金額枠を選んで入力</p></aside><section id="plans" class="grid grid-cols-3 gap-2.5 flex-1 min-w-0 overflow-y-auto"></section></main><div id="modal" class="hidden fixed inset-0 bg-black/60 z-50 items-center justify-center p-4"><div class="bg-white rounded-2xl p-5 w-full max-w-md"><div class="flex justify-between mb-3"><b>プリセット管理</b><button id="closeModal">✕</button></div><div class="grid grid-cols-2 gap-2 mb-2"><input id="newName" class="border rounded-lg p-2 text-sm" placeholder="項目名"><input id="newPrice" type="number" class="border rounded-lg p-2 text-sm" placeholder="金額"></div><button id="addPreset" class="w-full bg-blue-600 text-white p-2 rounded-lg">追加</button><div id="presetList" class="mt-3 space-y-2 max-h-60 overflow-auto"></div></div></div><div id="customer" class="hidden fixed inset-0 bg-slate-950 text-white z-50 p-5 overflow-auto"><div class="max-w-6xl mx-auto"><div class="flex justify-between items-center border-b border-slate-800 pb-3"><div><small class="text-blue-400">ESTIMATE COMPARISON</small><h2 class="text-xl font-black">お見積もり・プラン比較</h2></div><button id="closeCustomer" class="bg-slate-800 px-4 py-2 rounded-xl">✕ 閉じる</button></div><div id="presentation" class="grid grid-cols-3 gap-4 my-5"></div><div class="text-center text-xs text-slate-500">※表示金額はすべて消費税込みの総額表示です。</div></div></div><script>
const defaultPresets=[['標準設置工事費',11000],['5年延長保証料',3300],['家電リサイクル収集運搬料',4180],['エアコン標準工事',16500],['室外機化粧カバー',8800],['HDMIケーブル',2480]];
let presets=JSON.parse(localStorage.getItem('presets3ren')||'null')||defaultPresets.map((x,i)=>({id:'p'+i,name:x[0],price:x[1]}));
let plans=[{code:'A',title:'標準単品プラン',items:[['商品本体',128000],['',''],['','']]},{code:'B',title:'標準工事・保証セット',items:[['商品本体',128000],['5年延長保証料',3300],['標準設置工事費',11000]]},{code:'C',title:'フル安心お得パック',items:[['商品本体',128000],['5年延長保証料',3300],['標準設置工事費',11000],['家電リサイクル収集運搬料',4180]]}];
let active={p:0,i:0},expr='';
const $=id=>document.getElementById(id); const money=n=>'¥'+(Number(n)||0).toLocaleString();
function render(){
 $('plans').innerHTML=plans.map((p,pi)=>{let total=p.items.reduce((s,x)=>s+(Number(x[1])||0),0);let base=plans[0].items.reduce((s,x)=>s+(Number(x[1])||0),0);let diff=base-total;return `<article class="bg-white rounded-2xl border-2 ${pi===1?'border-blue-400':pi===2?'border-emerald-500':'border-slate-300'} shadow-sm overflow-hidden flex flex-col"><div class="bg-slate-50 px-2.5 py-2 flex items-center gap-2"><span class="bg-${pi===2?'emerald':pi===1?'blue':'slate'}-600 text-white px-2 py-1 rounded-lg font-black">${p.code}</span><input value="${esc(p.title)}" data-title="${pi}" class="bg-transparent font-bold text-xs flex-1 min-w-0"><button data-clear="${pi}" class="text-slate-400">🗑</button></div><div class="bg-slate-900 text-white p-3"><small class="text-slate-400">お支払総額 (税込)</small><div class="text-2xl font-black">${money(total)}</div><div class="border-t border-slate-700 mt-2 pt-1 text-xs ${diff>0?'text-amber-400':'text-slate-400'}">${pi===0?'基準プラン':diff>0?money(diff)+' おトク！':diff<0?'+'+money(-diff):'差額なし'}</div></div><div class="p-2 flex-1 overflow-auto"><div class="flex justify-between text-[10px] font-bold text-slate-400 mb-2"><span>📋 内訳明細</span><button data-add="${pi}" class="text-blue-600">＋ 行追加</button></div>${p.items.map((x,ii)=>`<div class="bg-slate-50 border rounded-xl p-1.5 mb-1.5"><div class="flex gap-1"><input value="${esc(x[0])}" data-name="${pi}-${ii}" placeholder="品名・項目名" class="w-full border rounded-lg p-1 text-xs font-bold"><button data-remove="${pi}-${ii}" class="text-slate-400">✕</button></div><div data-slot="${pi}-${ii}" class="slot ${active.p===pi&&active.i===ii?'active':''} mt-1 border rounded-lg bg-white p-1.5 text-right font-black cursor-pointer">${money(x[1])}</div></div>`).join('')}</div></article>`}).join('');bindPlanEvents();renderPresets();updateBuffer();}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function bindPlanEvents(){document.querySelectorAll('[data-title]').forEach(e=>e.oninput=()=>plans[e.dataset.title].title=e.value);document.querySelectorAll('[data-slot]').forEach(e=>e.onclick=()=>{let[a,b]=e.dataset.slot.split('-').map(Number);active={p:a,i:b};expr=String(plans[a].items[b][1]||'');render()});document.querySelectorAll('[data-name]').forEach(e=>e.oninput=()=>{let[a,b]=e.dataset.name.split('-').map(Number);plans[a].items[b][0]=e.value});document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{let[a,b]=e.dataset.remove.split('-').map(Number);plans[a].items.splice(b,1);if(!plans[a].items.length)plans[a].items.push(['','']);active={p:a,i:0};render()});document.querySelectorAll('[data-add]').forEach(e=>e.onclick=()=>{let p=+e.dataset.add;plans[p].items.push(['','']);active={p,i:plans[p].items.length-1};expr='';render()});document.querySelectorAll('[data-clear]').forEach(e=>e.onclick=()=>{let p=+e.dataset.clear;plans[p].items=[['商品本体',''],['',''],['','']];active={p,i:0};expr='';render()})}
function updateBuffer(){$('buffer').textContent=expr||'0'}
function key(k){let item=plans[active.p].items[active.i];if(k==='C'){expr='';item[1]=''}else if(k==='BS'){expr=expr.slice(0,-1)}else if(k==='='){try{let safe=expr.replace(/[^0-9+\-*/.]/g,'');let v=Math.floor(Function('return '+safe)());if(isFinite(v)){expr=String(Math.max(0,v));item[1]=expr}}catch{}}else if('+-*/'.includes(k)){if(expr&&!'+-*/'.includes(expr.slice(-1)))expr+=k}else{expr+=k}if(!isNaN(expr)&&expr!=='')item[1]=expr;updateBuffer();render()}
function renderKeypad(){$('keypad').innerHTML=[['7','8','9','/'],['4','5','6','*'],['1','2','3','-'],['0','00','000','+'],['BS','C','=','NEXT']].flat().map(k=>`<button data-key="${k}" class="p-3 rounded-xl font-black ${'/ * - +'.includes(k)?'bg-amber-500 text-white':k==='C'?'bg-rose-600 text-white':k==='='?'bg-emerald-600 text-white':k==='NEXT'?'bg-blue-600 text-white':'bg-slate-100'}">${k==='/'?'÷':k==='*'?'×':k==='- ' ?'－':k==='NEXT'?'次へ':k==='BS'?'BS':k==='C'?'クリア':k}</button>`).join('');document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{let k=b.dataset.key;if(k==='NEXT'){let i=active.i+1,p=active.p;if(i>=plans[p].items.length){i=0;p=(p+1)%3}active={p,i};expr=String(plans[p].items[i][1]||'');render()}else key(k)})}
function renderPresets(){$('presetSelect').innerHTML='<option value="">✨ 定番アイテム・工事費を選択</option>'+presets.map(p=>`<option value="${p.id}">${esc(p.name)} (${money(p.price)})</option>`).join('');$('presetList').innerHTML=presets.map((p,i)=>`<div class="flex justify-between items-center bg-slate-100 p-2 rounded-lg text-xs"><b>${esc(p.name)}</b><span>${money(p.price)} <button data-delpre="${i}" class="text-rose-500">✕</button></span></div>`).join('');document.querySelectorAll('[data-delpre]').forEach(b=>b.onclick=()=>{presets.splice(+b.dataset.delpre,1);savePresets();renderPresets()})}
function savePresets(){localStorage.setItem('presets3ren',JSON.stringify(presets))}
$('presetSelect').onchange=e=>{let p=presets.find(x=>x.id===e.target.value);if(p){plans[active.p].items[active.i]=[p.name,p.price];expr=String(p.price);render()}e.target.value=''};
$('manageBtn').onclick=()=>{$('modal').classList.remove('hidden');$('modal').classList.add('flex');renderPresets()};$('closeModal').onclick=()=>{$('modal').classList.add('hidden');$('modal').classList.remove('flex')};$('addPreset').onclick=()=>{let n=$('newName').value.trim(),v=Number($('newPrice').value)||0;if(n){presets.push({id:'c'+Date.now(),name:n,price:v});savePresets();$('newName').value='';$('newPrice').value='';renderPresets()}};
$('resetBtn').onclick=()=>{if(confirm('3プランを初期状態に戻しますか？')){location.reload()}};
$('darkBtn').onclick=()=>{document.documentElement.classList.toggle('dark');document.body.classList.toggle('bg-slate-950')};
$('customerBtn').onclick=showCustomer;$('closeCustomer').onclick=()=>{$('customer').classList.add('hidden')};function showCustomer(){$('presentation').innerHTML=plans.map((p,i)=>{let total=p.items.reduce((s,x)=>s+(Number(x[1])||0),0);return `<div class="bg-slate-900 border ${i===2?'border-emerald-500 ring-2 ring-emerald-500':'border-slate-800'} rounded-2xl p-4 flex flex-col justify-between"><h3 class="font-black mb-3">${p.code} ${esc(p.title)}</h3><div class="space-y-1 mb-4">${p.items.filter(x=>x[0]||x[1]).map(x=>`<div class="flex justify-between border-b border-slate-800 py-1 text-xs"><span>${esc(x[0]||'項目')}</span><b>${money(x[1])}</b></div>`).join('')}</div><div><small class="text-slate-400">お支払総額 (税込)</small><div class="text-3xl font-black">${money(total)}</div></div></div>`}).join('');$('customer').classList.remove('hidden')}
renderKeypad();render();
</script><script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body></html>
